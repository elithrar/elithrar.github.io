# Dependencies
markdown: kramdown
kramdown:
  syntax_highlighter: rouge
highlighter: rouge

# Disable theme (using custom CSS)
theme: null

# Sass configuration (UTF-8 encoding for theme compatibility)
encoding: utf-8
sass:
  style: compressed
  sass_dir: _sass
  sourcemap: never

# Permalinks
permalink: "/article/:title/"

# Setup
title: "Questionable Services"
tagline: "Writings about computing, agents, and the Internet."
byline: "by Matt Silverlock"
description: "Writings about computing, agents, and the Internet."
domain: "blog.questionable.services"
url: "https://blog.questionable.services"
baseurl: ""

author:
  name: "Matt Silverlock"
  email: "matt@eatsleeprepeat.net"
  url: "https://github.com/elithrar"
  twitter: "elithrar"
  othersite: "https://vsco.co/silverlock"

plugins:
  - "jekyll-paginate"
  - "jekyll-feed"

feed:
  path: atom.xml

paginate: 5

# Custom vars
github:
  url: "https://blog.questionable.services"
  repo: https://github.com/elithrar/elithrar.github.io

# Keep build tooling and development dependencies out of the public site.
exclude:
  - node_modules
  - desktop
  - scripts
  - docs
  - src
  - package.json
  - package-lock.json
  - tsconfig.json
  - vite.config.mjs
  - wrangler.jsonc
  - README.md
  - Gemfile
  - Gemfile.lock
