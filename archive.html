---
layout: default
title: Archive
permalink: /archive/
---
<section class="archive" aria-labelledby="archive-title">
  <div class="archive-header"><h1 id="archive-title">All Posts</h1><span class="annotation">{{ site.posts | size }} Entries</span></div>
  <ul class="archive-list">
    {% for post in site.posts %}
    <li class="writing-row">
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%B, %Y" }}</time>
      <h2><a href="{{ post.url }}">{{ post.title }}<span class="row-arrow" aria-hidden="true">→</span></a></h2>
    </li>
    {% endfor %}
  </ul>
</section>
