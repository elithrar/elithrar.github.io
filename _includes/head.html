<head>
  <link href="https://gmpg.org/xfn/11" rel="profile" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />

  <!-- Enable responsiveness on mobile devices-->
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta name="author" content="{{ site.author.name }}" />
  <meta name="description" content="{{ site.tagline }}" />
  <link rel="canonical" href="{{ site.url }}{{ page.url }}" />

  <title>
    {% if page.title %} {{ page.title }} &middot; {{ site.title }} {% else %} {{
    site.title }} &middot; {{ site.tagline }} {% endif %}
  </title>

  <!-- Newsreader Medium Italic, reduced to the Latin subset used by the site. -->
  <link
    rel="preload"
    href="/public/fonts/newsreader-latin-italic-500-v26.woff2"
    as="font"
    type="font/woff2"
    crossorigin
  />

  <!-- CSS -->
  <link rel="stylesheet" href="/public/css/poole.css" />
  <link rel="stylesheet" href="/public/css/app.css" />
  <!-- Preload code syntax CSS (non-blocking) -->
  <link rel="preload" as="style" href="/public/css/syntax.css" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="/public/css/syntax.css"></noscript>
  
  <!-- Icons -->
  <link rel="shortcut icon" href="/public/favicon.ico" />

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" href="/atom.xml" />
</head>
