<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en-us">
  {% include head.html %}

  <body>
    <div class="container">
      <div class="header">
        {% if page.url == "/" or paginator %}
        <h1 class="header-title"><a href="/">{{ site.title }}</a></h1>
        {% else %}
        <p class="header-title"><a href="/">{{ site.title }}</a></p>
        {% endif %}
        <p class="lead header-lead">
          {{ site.tagline }}
        </p>
        <p class="lead header-lead">
          (by
          <a href="https://twitter.com/@{{ site.author.twitter }}"
            >{{ site.author.name }}</a
          >)
        </p>
      </div>
      {{ content }}
    </div>

    <hr />
    {% include footer.html %}
  </body>
</html>
