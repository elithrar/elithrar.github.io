<!DOCTYPE html>
<html lang="en-US">
  {% include head.html %}
  <body class="{% if page.layout == 'post' %}article-page{% endif %}">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="site-frame">
      <header class="site-header">
        <a class="site-signature" href="/" aria-label="Questionable Services — home">Questionable Services<span aria-hidden="true">.</span></a>
        <nav class="primary-nav" aria-label="Main navigation">
          <a href="/" {% if page.url == '/' or paginator %}aria-current="page"{% endif %}>Writing</a>
          <a href="/archive/" {% if page.url == '/archive/' %}aria-current="page"{% endif %}>Archive</a>
          <a href="/atom.xml">RSS <span aria-hidden="true">↗</span></a>
        </nav>
      </header>
      <main id="main" tabindex="-1">{{ content }}</main>
      {% include footer.html %}
    </div>
    <script src="/public/js/site.js" defer></script>
  </body>
</html>
