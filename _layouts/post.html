---
layout: default
---
<article class="post">
  <header class="article-header">
    <div class="post-meta"><a href="/archive/">Writing / Archive</a><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B, %Y" }}</time></div>
    <h1 class="post-title">{{ page.title }}</h1>
  </header>
  <div class="post-content">{{ content }}</div>
</article>
<section class="related" aria-labelledby="related-title">
  <div class="section-bar"><h2 id="related-title">Recent Posts</h2><a href="/archive/">All Posts <span aria-hidden="true">↗</span></a></div>
  <ul class="related-posts">
    {% for post in site.related_posts limit:4 %}
    <li><a href="{{ post.url }}">{{ post.title }}<span aria-hidden="true">↗</span></a></li>
    {% endfor %}
  </ul>
</section>
