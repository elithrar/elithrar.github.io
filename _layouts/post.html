---
layout: default
---

<article class="post">
  <hr />
  <h1 class="post-title">
    <a href="{{ page.url }}">
      {{ page.title }}
    </a>
  </h1>
  <time class="post-month" datetime="{{ page.date | date_to_xmlschema }}"
    >{{ page.date | date: "%B, %Y" }}</time
  >
  <span class="post-bullets" aria-hidden="true">&#8226;&#8226;&#8226;</span>
  <div class="post-content">
    {{ content }}
  </div>
</article>

<div class="related">
  <h2>Recent Posts</h2>
  <ul class="related-posts">
    {% for post in site.related_posts limit:4 %}
    <li>
      <h3>
        <a href="{{ post.url }}">
          {{ post.title }}
        </a>
      </h3>
    </li>
    {% endfor %}
  </ul>
</div>
